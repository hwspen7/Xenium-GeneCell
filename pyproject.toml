
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xenium-genecell"
version = "0.1.0.dev0"
description = "Cross-platform representation learning for Xenium single-cell transcriptomics"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "torch==2.13.0",
    "numpy==1.26.4",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "scanpy[leiden]==1.11.5",
    "anndata==0.12.6",
    "h5py>=3.11,<4",
    "matplotlib>=3.8,<4",
    "PyYAML>=6,<7",
    "tqdm>=4.66,<5",
    "rich>=13,<16",
    "tensorboard>=2.17,<3",
    "umap-learn>=0.5.6,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "build>=1.2,<2",
]

notebook = [
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "seaborn>=0.13,<1",
    "networkx>=3,<4",
]

[project.scripts]
cellmae = "cellmae.cli:main"

[tool.setuptools]
packages = [
    "cellmae",
    "cellmae.data",
    "cellmae.models",
    "cellmae.training",
    "cellmae.evaluation",
]

[tool.setuptools.package-dir]
cellmae = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
